id: count_taxi_rows_year
namespace: zoomcamp
description: Count the number of rows for a given taxi type and year using DuckDB

inputs:
  - id: taxi
    type: SELECT
    displayName: Select taxi type
    values: [yellow, green]
    defaults: yellow

  - id: year
    type: SELECT
    displayName: Select year
    values: ["2019", "2020", "2021"]
    defaults: "2020"

tasks:
  - id: count_all_months
    type: io.kestra.plugin.scripts.python.Script
    beforeCommands:
      - pip install duckdb kestra
    env:
      TAXI: "{{inputs.taxi}}"
      YEAR: "{{inputs.year}}"
    script: |
        import duckdb
        import os
        import urllib.request
        import gzip
        import shutil

        taxi = os.environ.get('TAXI')
        year = os.environ.get('YEAR')
        months = ["01","02","03","04","05","06","07","08","09","10","11","12"]
        
        total_count = 0
        
        for month in months:
            url = f"https://github.com/DataTalksClub/nyc-tlc-data/releases/download/{taxi}/{taxi}_tripdata_{year}-{month}.csv.gz"
            
            urllib.request.urlretrieve(url, "data.csv.gz")
            
            with gzip.open("data.csv.gz", "rb") as f_in:
                with open("data.csv", "wb") as f_out:
                    shutil.copyfileobj(f_in, f_out)
            
            con = duckdb.connect(database=':memory:')
            count = con.execute("SELECT COUNT(*) FROM read_csv_auto('data.csv')").fetchone()[0]
            print(f"Month {month} rows: {count}")
            total_count += count
            con.close()
        
        print(f"Total rows for {taxi} in {year}: {total_count}")
        
        from kestra import Kestra
        Kestra.outputs({'total_count': total_count})